version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    # The Node types follow the oldest Node the project supports (engines:
    # >=22.15), so the compiler never accepts an API Node 22 lacks; minor and
    # patch updates of 22.x still come.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ['*']

  # The claude CLI pinned for CI's mod job (tools/claude-cli): its own group,
  # so a CLI bump is reviewed on its own (it changes the API the mod is tested on).
  - package-ecosystem: npm
    directory: /tools/claude-cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      claude-cli:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
