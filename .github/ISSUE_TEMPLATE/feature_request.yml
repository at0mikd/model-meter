name: Feature request
description: An idea to improve the mod.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you want to do and why the mod does not let you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you picture it. Mock-ups in text are welcome.
    validations:
      required: true
