name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the same checks on a tag before it publishes (T-012).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: check:core (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint reads every commit of the pull request
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:core

  mod:
    # A stable name, so a required check survives a CLI update (T-008); the
    # version shows in the log, from `claude --version` below.
    name: mod (validate, test:mod, capabilities)
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The only install that runs package scripts: the CLI's postinstall fetches
      # its native binary. Exact version and integrity come from its own lockfile
      # (tools/claude-cli), isolated in this job; no project dependency is
      # installed here (the three steps below use only the CLI and Node built-ins).
      - name: Install the claude CLI (exact version, from its lockfile)
        run: npm ci --prefix tools/claude-cli
      # The only tree here that runs install scripts is audited too; an advisory
      # without a fix is a new exception for the Maintainer, never silenced.
      - name: Audit the claude CLI's lockfile
        run: npm audit --prefix tools/claude-cli --audit-level=low
      - name: Put the claude CLI on PATH
        run: echo "$GITHUB_WORKSPACE/tools/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: npm run validate
      - run: npm run test:mod
      - run: npm run capabilities

  # A dry run of the release package on every pull request (T-012 AC3): the
  # same script as the release workflow, publishing nothing.
  package:
    name: package (dry run)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The three manifests agree on the version
        run: |
          version=$(node -p "require('./plugins/model-meter/.claude-plugin/plugin.json').version")
          node scripts/release-version.mjs check "v$version"
      - name: Package what the marketplace serves (explicit file list)
        run: node scripts/package.mjs
      - name: Check the digest
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      # The archive's sha256, as a job output: the only thing later jobs trust.
      - name: The archive's digest, as a job output
        id: digest
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/model-meter-*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one archive in dist/, found ${#archives[@]}"
            exit 1
          fi
          digest=$(sha256sum -- "${archives[0]}" | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${archives[0]#dist/}: sha256 $digest"
      - name: The archive's contents
        run: tar -tzvf dist/model-meter-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dry-run
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The release's digest check, on every pull request (T-015): a second job
  # downloads the dry run's artifact and compares it with the package job's
  # output, with the same step as release.yml's attest and release jobs.
  package-digest:
    name: package (digest across jobs)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dry-run
          path: dist
      # The archive must be the bytes the package job hashed (T-013 audit, N3): a
      # replaced artifact, even with a regenerated SHA256SUMS, fails here.
      - name: The archive is the one the package job built
        id: archive
        env:
          DIGEST: ${{ needs.package.outputs.digest }}
          TAG: ''
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the package job gave no sha256 digest"
            exit 1
          fi
          shopt -s nullglob
          archives=(dist/model-meter-*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one archive in dist/, found ${#archives[@]}"
            exit 1
          fi
          name=${archives[0]#dist/}
          if ! [[ "$name" =~ ^model-meter-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$ ]]; then
            echo "::error::the archive in dist/ is not named model-meter-X.Y.Z.tar.gz"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$name" != "model-meter-${TAG#v}.tar.gz" ]; then
            echo "::error::$name is not the archive of $TAG"
            exit 1
          fi
          actual=$(sha256sum -- "dist/$name" | cut -d ' ' -f 1)
          if [ "$actual" != "$DIGEST" ]; then
            echo "::error::$name has sha256 $actual, not the package job's $DIGEST"
            exit 1
          fi
          if ! printf '%s  %s\n' "$DIGEST" "$name" | cmp -s - dist/SHA256SUMS; then
            echo "::error::dist/SHA256SUMS does not list the package job's digest for $name"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "$name: sha256 $DIGEST, the package job's digest"
