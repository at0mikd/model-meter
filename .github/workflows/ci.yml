name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: check:core (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint reads every commit of the pull request
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:core

  mod:
    name: validate, test:mod, capabilities (claude CLI 2.1.327)
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The only install that runs package scripts: the CLI's postinstall fetches
      # its native binary. Exact version and integrity come from its own lockfile
      # (tools/claude-cli), isolated in this job; no project dependency is
      # installed here (the three steps below use only the CLI and Node built-ins).
      - name: Install the claude CLI (exact version, from its lockfile)
        run: npm ci --prefix tools/claude-cli
      - name: Put the claude CLI on PATH
        run: echo "$GITHUB_WORKSPACE/tools/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: npm run validate
      - run: npm run test:mod
      - run: npm run capabilities
