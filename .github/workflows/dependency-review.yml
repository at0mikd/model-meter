name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          # No advisory is excepted today. An exception goes in security/audit-exceptions.json,
          # approved by the Maintainer with an expiry date, and its id in an allow-ghsas
          # input here; `npm run audit` fails if the two differ.
