name: Release

# Publishes model-meter from a tag vX.Y.Z (T-012, docs/RELEASING.md): the tag
# must match the three manifests, be annotated, signed and verified, and point
# to a commit on main; the full check runs again, and the package is built,
# attested and released. It runs on tags alone, never on a pull
# request or a branch. It is the only workflow that may write the repository's
# contents or ask for an OIDC token, each in the one job that needs it.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: tag matches the manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to tell whether the tagged commit is on main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No cache in a publishing workflow: a poisoned cache could reach the release.
          package-manager-cache: false
      - name: The tag is v plus the version of plugin.json, marketplace.json and package.json
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs check "$TAG"
      # Only reviewed, merged code is released: the tagged commit must be on main.
      # The commit is HEAD, which the checkout resolved from the tag.
      - name: The tagged commit is on main
        run: |
          commit=$(git rev-parse 'HEAD^{commit}')
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::the tagged commit $commit is not on main"
            exit 1
          fi
          echo "$commit is on main"
      # A release tag is annotated and signed, its signature verified by GitHub,
      # and it points to exactly the commit being released.
      - name: The tag is annotated, signed and verified
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse 'HEAD^{commit}')
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          read -r kind object <<< "$ref"
          if [ "$kind" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag: release tags are annotated and signed (git tag -s)"
            exit 1
          fi
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq '"\(.verification.verified) \(.verification.reason) \(.object.sha)"')
          read -r verified reason target <<< "$tag"
          if [ "$verified" != "true" ]; then
            echo "::error::the signature of $TAG is not verified by GitHub ($reason)"
            exit 1
          fi
          if [ "$target" != "$commit" ]; then
            echo "::error::$TAG points to $target, not to the commit being released ($commit)"
            exit 1
          fi
          # The release job checks the tag against this run's commit again, by GITHUB_SHA.
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::the checked-out commit $commit is not this run's commit $GITHUB_SHA"
            exit 1
          fi
          echo "$TAG: annotated, signed and verified ($reason), on $commit"

  check:
    name: npm run check
    needs: version
    permissions:
      contents: read
    # `./` loads ci.yml from the caller's own commit, not from a checkout's files.
    # GitHub's newer `$/` form is newer than the actionlint pinned in CI (1.7.12).
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  package:
    name: package
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No cache in a publishing workflow: a poisoned cache could reach the release.
          package-manager-cache: false
      - name: Package what the marketplace serves (explicit file list)
        run: node scripts/package.mjs
      - name: Check the digest
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      # The archive's sha256, as a job output: the only thing later jobs trust.
      - name: The archive's digest, as a job output
        id: digest
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/model-meter-*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one archive in dist/, found ${#archives[@]}"
            exit 1
          fi
          digest=$(sha256sum -- "${archives[0]}" | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${archives[0]#dist/}: sha256 $digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest provenance
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      # The archive must be the bytes the package job hashed (T-013 audit, N3): a
      # replaced artifact, even with a regenerated SHA256SUMS, fails here.
      - name: The archive is the one the package job built
        id: archive
        env:
          DIGEST: ${{ needs.package.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the package job gave no sha256 digest"
            exit 1
          fi
          shopt -s nullglob
          archives=(dist/model-meter-*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one archive in dist/, found ${#archives[@]}"
            exit 1
          fi
          name=${archives[0]#dist/}
          if ! [[ "$name" =~ ^model-meter-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$ ]]; then
            echo "::error::the archive in dist/ is not named model-meter-X.Y.Z.tar.gz"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$name" != "model-meter-${TAG#v}.tar.gz" ]; then
            echo "::error::$name is not the archive of $TAG"
            exit 1
          fi
          actual=$(sha256sum -- "dist/$name" | cut -d ' ' -f 1)
          if [ "$actual" != "$DIGEST" ]; then
            echo "::error::$name has sha256 $actual, not the package job's $DIGEST"
            exit 1
          fi
          if ! printf '%s  %s\n' "$DIGEST" "$name" | cmp -s - dist/SHA256SUMS; then
            echo "::error::dist/SHA256SUMS does not list the package job's digest for $name"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "$name: sha256 $DIGEST, the package job's digest"
      # Attests the package job's digest, not whatever file sits at a path.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.archive.outputs.name }}
          subject-digest: sha256:${{ needs.package.outputs.digest }}

  release:
    name: GitHub release
    needs: [package, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No cache in a publishing workflow: a poisoned cache could reach the release.
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      # The archive must be the bytes the package job hashed (T-013 audit, N3): a
      # replaced artifact, even with a regenerated SHA256SUMS, fails here.
      - name: The archive is the one the package job built
        id: archive
        env:
          DIGEST: ${{ needs.package.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the package job gave no sha256 digest"
            exit 1
          fi
          shopt -s nullglob
          archives=(dist/model-meter-*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one archive in dist/, found ${#archives[@]}"
            exit 1
          fi
          name=${archives[0]#dist/}
          if ! [[ "$name" =~ ^model-meter-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$ ]]; then
            echo "::error::the archive in dist/ is not named model-meter-X.Y.Z.tar.gz"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$name" != "model-meter-${TAG#v}.tar.gz" ]; then
            echo "::error::$name is not the archive of $TAG"
            exit 1
          fi
          actual=$(sha256sum -- "dist/$name" | cut -d ' ' -f 1)
          if [ "$actual" != "$DIGEST" ]; then
            echo "::error::$name has sha256 $actual, not the package job's $DIGEST"
            exit 1
          fi
          if ! printf '%s  %s\n' "$DIGEST" "$name" | cmp -s - dist/SHA256SUMS; then
            echo "::error::dist/SHA256SUMS does not list the package job's digest for $name"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "$name: sha256 $DIGEST, the package job's digest"
      - name: Release notes, from that version's section of CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs notes "$TAG" > "$RUNNER_TEMP/notes.md"
      # The tag must not have moved since the run started (a hardening note of T-013).
      - name: The tag still points to this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          read -r kind object <<< "$ref"
          commit=$object
          if [ "$kind" = "tag" ]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq '.object.sha')
          fi
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now points to $commit, not to this run's commit $GITHUB_SHA"
            exit 1
          fi
          echo "$TAG still points to $GITHUB_SHA"
      - name: Create the release with the archive and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.archive.outputs.name }}
        run: >-
          gh release create "$TAG" "dist/$NAME" dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "model-meter $TAG"
          --notes-file "$RUNNER_TEMP/notes.md"
